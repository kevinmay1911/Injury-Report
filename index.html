<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Injury Report</title>
<meta name="theme-color" content="#1d3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Injury Report">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{--ink:#16202b;--muted:#5b6774;--line:#d5dbe2;--bg:#f3f5f8;--card:#fff;--accent:#1d3a5f;--accent2:#2f5d92;--ok:#1f7a4d}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  header{position:sticky;top:0;padding-top:max(10px,env(safe-area-inset-top));z-index:5;background:var(--accent);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.02em}
  header .sub{font-size:12px;opacity:.75}
  header .sp{flex:1}
  button{font:inherit;border-radius:6px;border:1px solid transparent;padding:7px 13px;cursor:pointer}
  .btn-primary{background:#fff;color:var(--accent);font-weight:650}
  .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
  .btn-ghost:hover{background:rgba(255,255,255,.1)}
  main{max-width:1040px;margin:0 auto;padding:18px 16px 80px}
  .banner{background:#fff8e1;border:1px solid #f0d48a;border-radius:8px;padding:10px 14px;margin-bottom:14px;display:none;align-items:center;gap:10px;flex-wrap:wrap}
  .banner button{background:var(--accent);color:#fff}
  .banner .link{background:none;color:var(--accent);text-decoration:underline;padding:0}
  section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  section h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:#eaf0f7;padding:9px 14px;border-bottom:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px 12px;padding:14px}
  .f{display:flex;flex-direction:column;gap:4px;min-width:0}
  .f>label,.lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  input[type=text],input[type=date],input[type=time],select,textarea{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid #9cc1ea;border-color:var(--accent2)}
  textarea{resize:vertical;min-height:150px;line-height:1.45}
  .opts{display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:4px}
  .opts label{display:flex;align-items:center;gap:6px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:450;cursor:pointer}
  .opts input{width:16px;height:16px;accent-color:var(--accent2)}
  .s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
  .sub-h{grid-column:span 12;font-size:12px;font-weight:650;color:var(--accent);border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
  .sub-h:first-child{border-top:0;padding-top:0;margin-top:0}
  table.inv{width:100%;border-collapse:collapse}
  table.inv th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:0 6px 6px}
  table.inv td{padding:4px 6px}
  .hint{font-size:12px;color:var(--muted)}
  .count{font-size:11px;color:var(--muted);text-align:right}
  .dict{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
  .mic{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;font-weight:600}
  .mic svg{width:16px;height:16px}
  .mic.rec{background:#b3261e;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(179,38,30,.45)}50%{box-shadow:0 0 0 7px rgba(179,38,30,0)}}
  .interim{font-size:13px;color:var(--muted);font-style:italic}
  section h2{display:flex;align-items:center;gap:10px}
  section h2 .act{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px;background:var(--accent);color:#fff;font-weight:600;padding:5px 11px;display:inline-flex;align-items:center;gap:6px}
  section h2 .act svg,.pbtn svg{width:15px;height:15px}
  .pbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pbtn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;font-weight:600}
  .pbtn.alt{background:#fff;color:var(--accent);border-color:var(--accent)}
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
  .ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fafbfc;display:flex;flex-direction:column}
  .ph img{width:100%;height:130px;object-fit:cover;display:block;background:#dde3ea}
  .ph .meta{padding:6px 8px;display:flex;flex-direction:column;gap:5px}
  .ph .meta small{color:var(--muted);font-size:11px}
  .ph .meta input{padding:5px 7px;font-size:13px}
  .ph .rm{align-self:flex-start;background:none;color:#b3261e;padding:0;font-size:12px;text-decoration:underline}
  dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(10,20,35,.55)}
  .dlg-h{background:var(--accent);color:#fff;padding:11px 16px;font-weight:650;display:flex;align-items:center}
  .dlg-h button{margin-left:auto;background:none;color:#fff;font-size:20px;line-height:1;padding:0 4px}
  .dlg-b{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .cam{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:4/3}
  .cam video{width:100%;height:100%;object-fit:cover;display:block}
  .cam .frame{position:absolute;left:7%;right:7%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.85);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
  .cam.photo .frame{display:none}
  .dlg-msg{font-size:13px;color:var(--muted)}
  .dlg-msg.err{color:#b3261e}
  .dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:0 16px 14px}
  .flash{animation:flash 1.6s ease-out}
  @keyframes flash{0%{background:#d9f2e4}100%{background:#fff}}
  .sigwrap{grid-column:span 12;display:flex;flex-direction:column;gap:6px}
  .sigpad{position:relative;border:1px solid var(--line);border-radius:8px;background:#fff;height:150px;touch-action:none;cursor:crosshair;max-width:560px}
  .sigpad canvas{width:100%;height:100%;display:block;border-radius:8px}
  .sigpad .line{position:absolute;left:18px;right:18px;bottom:34px;border-bottom:1px solid #b9c2cc;pointer-events:none}
  .sigpad .x{position:absolute;left:18px;bottom:38px;color:#9aa5b1;font-size:18px;pointer-events:none}
  .sigpad .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa5b1;font-size:13px;pointer-events:none;border:0;background:none}
  .sigbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .sigbar .ok{color:var(--ok);font-size:13px;font-weight:600}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;font-size:13px}
  .toast.on{opacity:1}
  @media (max-width:760px){.s1,.s2,.s3,.s4,.s5{grid-column:span 6}.s6,.s8{grid-column:span 12} table.inv,table.inv tbody,table.inv tr,table.inv td{display:block;width:100%} table.inv thead{display:none} table.inv tr{border-bottom:1px solid var(--line);padding:6px 0}}
</style>
</head>
<body>
<header>
  <div><h1>Injury Report — APB Form 045</h1><div class="sub">Fill in, then download the completed Word form</div></div>
  <div class="sp"></div>
  <button class="btn-ghost" id="bClear" type="button">Clear form</button>
  <button class="btn-ghost" id="bSave" type="button">Save draft</button>
  <button class="btn-primary" id="bDocx" type="button">Download .docx</button>
</header>
<main>
  <div class="banner" id="draftBanner"><span id="draftMsg"></span><button type="button" id="bRestore">Restore draft</button><button type="button" class="link" id="bDiscard">Discard</button></div>
  <form id="f" autocomplete="off"></form>
  <p class="hint">Drafts are saved only in this browser, and only when you click “Save draft”. The report contains personal information — clear the form and discard drafts on shared computers.</p>
</main>
<dialog id="dlgScan">
  <div class="dlg-h">Scan driver’s license / ID<button type="button" data-close aria-label="Close">×</button></div>
  <div class="dlg-b">
    <div class="cam" id="scanCam" hidden><video id="scanVideo" playsinline muted></video><div class="frame"></div></div>
    <div class="dlg-msg" id="scanMsg"></div>
    <button type="button" class="pbtn alt" id="scanFromPhoto" hidden>Read barcode from a photo</button>
    <div class="f"><label for="scanText">Handheld scanner or pasted barcode data</label>
      <textarea id="scanText" style="min-height:80px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace" placeholder="Click here, then scan the barcode on the back of the card with a USB/Bluetooth scanner"></textarea></div>
  </div>
  <div class="dlg-f"><button type="button" class="pbtn alt" data-close>Cancel</button><button type="button" class="pbtn" id="scanApply">Fill victim info</button></div>
</dialog>
<dialog id="dlgCam">
  <div class="dlg-h">Take photos<button type="button" data-close aria-label="Close">×</button></div>
  <div class="dlg-b"><div class="cam photo"><video id="camVideo" playsinline muted></video></div><div class="dlg-msg" id="camMsg"></div></div>
  <div class="dlg-f"><button type="button" class="pbtn alt" data-close>Done</button><button type="button" class="pbtn" id="camShot">Capture</button></div>
</dialog>
<input type="file" id="fileCapture" accept="image/*" capture="environment" hidden>
<input type="file" id="filePick" accept="image/*" multiple hidden>
<input type="file" id="fileBarcode" accept="image/*" hidden>
<div class="toast" id="toast"></div>
<script>
// ---- Minimal ZIP + legacy Word form-field filler (no dependencies) ----
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function readZip(buf) {
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1; for (let i = buf.length - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('Not a zip file');
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const entries = [];
  for (let i = 0; i < count; i++) {
    const method = dv.getUint16(p + 10, true), time = dv.getUint16(p + 12, true), date = dv.getUint16(p + 14, true);
    const crc = dv.getUint32(p + 16, true), csize = dv.getUint32(p + 20, true), usize = dv.getUint32(p + 24, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nlen));
    const lnl = dv.getUint16(lho + 26, true), lxl = dv.getUint16(lho + 28, true);
    const data = buf.subarray(lho + 30 + lnl + lxl, lho + 30 + lnl + lxl + csize);
    entries.push({ name, method, time, date, crc, csize, usize, data });
    p += 46 + nlen + xlen + clen;
  }
  return entries;
}

async function inflateRaw(data) {
  const ds = new DecompressionStream('deflate-raw');
  const out = new Response(new Blob([data]).stream().pipeThrough(ds));
  return new Uint8Array(await out.arrayBuffer());
}

function writeZip(entries) {
  const enc = new TextEncoder(); const parts = []; const central = []; let off = 0;
  for (const e of entries) {
    const nm = enc.encode(e.name);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0, true); h.setUint16(8, e.method, true);
    h.setUint16(10, e.time, true); h.setUint16(12, e.date, true); h.setUint32(14, e.crc, true);
    h.setUint32(18, e.data.length, true); h.setUint32(22, e.usize, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), nm, e.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0, true); c.setUint16(10, e.method, true);
    c.setUint16(12, e.time, true); c.setUint16(14, e.date, true); c.setUint32(16, e.crc, true); c.setUint32(20, e.data.length, true);
    c.setUint32(24, e.usize, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + e.data.length;
  }
  const cdSize = central.reduce((s, a) => s + a.length, 0);
  const z = new DataView(new ArrayBuffer(22));
  z.setUint32(0, 0x06054b50, true); z.setUint16(8, entries.length, true); z.setUint16(10, entries.length, true);
  z.setUint32(12, cdSize, true); z.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(z.buffer)], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

const xmlEsc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function setText(xml, name, value) {
  if (value == null || value === '') return xml;
  const i = xml.indexOf(`w:name w:val="${name}"`); if (i < 0) return xml;
  const sep = xml.indexOf('w:fldCharType="separate"', i);
  let sepRunStart = xml.lastIndexOf('<w:r>', sep); const a2 = xml.lastIndexOf('<w:r ', sep); if (a2 > sepRunStart) sepRunStart = a2;
  const sepRunEnd = xml.indexOf('</w:r>', sep) + 6;
  const end = xml.indexOf('w:fldCharType="end"', sepRunEnd);
  let endRunStart = xml.lastIndexOf('<w:r>', end); const alt = xml.lastIndexOf('<w:r ', end);
  if (alt > endRunStart) endRunStart = alt;
  const rprM = xml.slice(sepRunStart, sepRunEnd).match(/<w:rPr>[\s\S]*?<\/w:rPr>/);
  const rpr = rprM ? rprM[0] : '';
  const body = String(value).split(/\r?\n/).map(l => `<w:t xml:space="preserve">${xmlEsc(l)}</w:t>`).join('<w:br/>');
  return xml.slice(0, sepRunEnd) + `<w:r>${rpr}${body}</w:r>` + xml.slice(endRunStart);
}
function setCheck(xml, name, on) {
  const i = xml.indexOf(`w:name w:val="${name}"`); if (i < 0) return xml;
  const a = xml.indexOf('<w:checkBox>', i), b = xml.indexOf('</w:checkBox>', a) + 13;
  return xml.slice(0, a) + `<w:checkBox><w:sizeAuto/><w:default w:val="0"/>${on ? '<w:checked/>' : '<w:checked w:val="0"/>'}</w:checkBox>` + xml.slice(b);
}
function setDrop(xml, name, idx) {
  const i = xml.indexOf(`w:name w:val="${name}"`); if (i < 0) return xml;
  const a = xml.indexOf('<w:ddList>', i), b = xml.indexOf('</w:ddList>', a);
  let inner = xml.slice(a + 10, b).replace(/<w:result [^>]*\/>/, '');
  return xml.slice(0, a) + `<w:ddList><w:result w:val="${idx}"/>` + inner + xml.slice(b);
}

// ---- Photo attachment pages ----
const EMU = 914400; // per inch
const P = (txt, { bold = false, size = 20, center = false, before = 0, after = 80, pageBreak = false } = {}) =>
  `<w:p><w:pPr>${pageBreak ? '<w:pageBreakBefore/>' : ''}<w:spacing w:before="${before}" w:after="${after}"/>${center ? '<w:jc w:val="center"/>' : ''}</w:pPr>` +
  `<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${bold ? '<w:b/>' : ''}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/></w:rPr><w:t xml:space="preserve">${xmlEsc(txt)}</w:t></w:r></w:p>`;
function picXml(n, rid, cx, cy) {
  return `<w:p><w:pPr><w:keepNext/><w:spacing w:before="120" w:after="40"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">` +
    `<wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${9000 + n}" name="Photo ${n}"/>` +
    `<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>` +
    `<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
    `<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${9000 + n}" name="photo${n}.jpg"/><pic:cNvPicPr/></pic:nvPicPr>` +
    `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
    `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>` +
    `</a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
}
function inlineRun(n, rid, cx, cy, fname) {
  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${9000 + n}" name="${fname}"/>` +
    `<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>` +
    `<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
    `<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${9000 + n}" name="${fname}"/><pic:cNvPicPr/></pic:nvPicPr>` +
    `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
    `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>` +
    `</a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
}
function afterField(xml, name, insert) {
  const i = xml.indexOf(`w:name w:val="${name}"`); if (i < 0) return xml;
  const e = xml.indexOf('w:fldCharType="end"', i); const r = xml.indexOf('</w:r>', e) + 6;
  return xml.slice(0, r) + insert + xml.slice(r);
}
async function setPart(entries, name, fn) {
  const e = entries.find(x => x.name === name);
  const raw = e.method === 8 ? await inflateRaw(e.data) : e.data;
  const out = new TextEncoder().encode(fn(new TextDecoder().decode(raw)));
  Object.assign(e, { method: 0, data: out, usize: out.length, crc: crc32(out) });
}

// fields: {text:{name:value}, check:{name:bool}, drop:{name:index}}
// photos: [{bytes:Uint8Array (JPEG), w, h, caption}] ; meta: {title lines}
async function fillDocx(templateBytes, fields, photos = [], meta = {}) {
  const entries = readZip(templateBytes);
  let photoXml = '', sigXml = '';
  const extraRels = [];
  if (meta.signature) {
    const g = meta.signature, nm = 'word/media/supervisor_signature.png';
    entries.push({ name: nm, method: 0, time: 0, date: 0x21, data: g.bytes, usize: g.bytes.length, crc: crc32(g.bytes) });
    extraRels.push('<Relationship Id="rIdSupSig" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/supervisor_signature.png"/>');
    const maxH = 0.34 * EMU, maxW = 1.7 * EMU, sc = Math.min(maxW / g.w, maxH / g.h);
    sigXml = '<w:r><w:t xml:space="preserve">  </w:t></w:r>' + inlineRun(1, 'rIdSupSig', Math.round(g.w * sc), Math.round(g.h * sc), 'Supervisor signature');
  }
  if (photos.length) {
    const rels = [];
    photos.forEach((p, i) => {
      const n = i + 1, name = `word/media/photo${n}.jpg`, rid = `rIdPhoto${n}`;
      entries.push({ name, method: 0, time: 0, date: 0x21, data: p.bytes, usize: p.bytes.length, crc: crc32(p.bytes) });
      rels.push(`<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/photo${n}.jpg"/>`);
      // Two photos per page: 7.5in wide x 4.0in tall box

const fmtDate = v => { if(!v) return ''; const [y,m,d]=v.split('-'); return `${m}/${d}/${y}`; };
const fmtTime = v => v ? v.replace(':','') : '';  // 24-hour HHMM
function collect(){
  const out={text:{},check:{},drop:{}};
  form.querySelectorAll('input,select,textarea').forEach(e=>{
    if(!e.id) return;
    if(e.type==='checkbox') out.check[e.id]=e.checked;
    else if(e.tagName==='SELECT') out.drop[e.id]=Number(e.value);
    else if(e.type==='date') out.text[e.id]= e.id==='Text28' ? fmtDate(e.value).replace(/\/(\d\d)(\d\d)$/,'/$2') : fmtDate(e.value);
    else if(e.type==='time') out.text[e.id]=fmtTime(e.value);
    else out.text[e.id]=e.value.trim();
  });
  // Page numbers and page-2 header
  out.text.Text2='1'; out.text.Text3='2'; out.text.Text85='2'; out.text.Text86='2';
  out.text.Text87=out.text.Text80||''; out.text.Text88=out.text.Text4||'';
  return out;
}

// ---------- Dictation (Web Speech API) ----------
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const MIC='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
  const CMDS=[[/\s*\bnew paragraph\b\s*/gi,'\n\n'],[/\s*\bnew line\b\s*/gi,'\n'],[/\s*\b(period|full stop)\b/gi,'.'],[/\s*\bcomma\b/gi,','],
              [/\s*\bquestion mark\b/gi,'?'],[/\s*\bcolon\b/gi,':'],[/\s*\bsemicolon\b/gi,';'],[/\s*\b(dash|hyphen)\b\s*/gi,'-'],
              [/\s*\bopen paren(thesis)?\b\s*/gi,' ('],[/\s*\bclose paren(thesis)?\b/gi,')'],[/\s*\bslash\b\s*/gi,'/']];
  const clean=t=>{ CMDS.forEach(([r,v])=>t=t.replace(r,v)); return t; };
  let active=null; // {rec, ta, btn, note}
  function stop(){ if(active){ try{active.rec.stop();}catch(e){} } }
  ['Text79','Text92'].forEach(id=>{
    const ta=document.getElementById(id);
    const bar=el('div',{class:'dict'}); const btn=el('button',{type:'button',class:'mic','aria-pressed':'false'},MIC+'<span>Dictate</span>');
    const note=el('span',{class:'interim'}); bar.append(btn,note); ta.insertAdjacentElement('afterend',bar);
    if(!SR){ btn.disabled=true; btn.style.opacity=.5; note.textContent='Dictation needs Chrome, Edge or Safari.'; return; }
    btn.onclick=()=>{
      if(active&&active.ta===ta){ stop(); return; }
      stop();
      const rec=new SR(); rec.lang='en-US'; rec.continuous=true; rec.interimResults=true;
      const st={rec,ta,btn,note}; active=st;
      rec.onstart=()=>{ btn.classList.add('rec'); btn.setAttribute('aria-pressed','true'); btn.lastChild.textContent='Stop'; note.textContent='Listening… say “period”, “comma”, “new line”.'; };
      rec.onresult=e=>{ let interim='';
        for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i];
          if(r.isFinal){ let t=clean(r[0].transcript.trim()); if(!t) continue;
            const cur=ta.value; const atStart=!cur.trim()||/[.?!]\s*$|\n\s*$/.test(cur);
            if(atStart) t=t.replace(/^\s*([a-z])/,m=>m.toUpperCase()); t=t.replace(/([.?!]\s+|\n\s*)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
            const sep=!cur||/[\s(\/-]$/.test(cur)||/^[.,?:;)\n]/.test(t)?'':' ';
            ta.value=cur+sep+t; ta.scrollTop=ta.scrollHeight;
          } else interim+=r[0].transcript; }
        note.textContent=interim?'“'+interim.trim()+'”':'Listening…'; };
      rec.onerror=e=>{ note.textContent = e.error==='not-allowed'||e.error==='service-not-allowed' ? 'Microphone access was blocked. Allow it in the browser’s address bar and try again.' : e.error==='no-speech' ? 'No speech heard.' : 'Dictation error: '+e.error; };
      rec.onend=()=>{ btn.classList.remove('rec'); btn.setAttribute('aria-pressed','false'); btn.lastChild.textContent='Dictate'; if(/^Listening|^“/.test(note.textContent)) note.textContent=''; if(active===st) active=null; };
      try{ rec.start(); }catch(err){ note.textContent='Could not start dictation: '+err.message; }
    };
  });
})();

const photos=[]; // {bytes,w,h,url,caption,taken}
const pad=n=>String(n).padStart(2,'0');
const stamp=d=>`${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()} ${pad(d.getHours())}${pad(d.getMinutes())}`;
async function toJpeg(src, taken){
  let bmp, w, h;
  if (src instanceof HTMLCanvasElement){ bmp=src; w=src.width; h=src.height; }
  else { try{ bmp=await createImageBitmap(src,{imageOrientation:'from-image'}); }catch(e){ bmp=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('Unsupported image')); im.src=URL.createObjectURL(src); }); }
         w=bmp.width||bmp.naturalWidth; h=bmp.height||bmp.naturalHeight; }
  const sc=Math.min(1,1600/Math.max(w,h)); const cw=Math.round(w*sc), ch=Math.round(h*sc);
  const c=document.createElement('canvas'); c.width=cw; c.height=ch; c.getContext('2d').drawImage(bmp,0,0,cw,ch);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
  return {bytes:new Uint8Array(await blob.arrayBuffer()), w:cw, h:ch, url:URL.createObjectURL(blob), caption:'', taken};
}
function renderPhotos(){
  const g=document.getElementById('photoGrid'); g.innerHTML='';
  photos.forEach((p,i)=>{ const d=el('div',{class:'ph'});

    const inp=d.querySelector('input'); inp.value=p.caption; inp.oninput=()=>p.caption=inp.value;
    d.querySelector('.rm').onclick=()=>{ URL.revokeObjectURL(p.url); photos.splice(i,1); renderPhotos(); };
    g.append(d); });
  document.getElementById('phCount').textContent = photos.length ? `${photos.length} photo${photos.length>1?'s':''} will be attached to the end of the Word report (not kept in saved drafts).` : 'Photos are added to the end of the Word report. They are not kept in saved drafts.';
}
async function addFiles(files){
  let n=0; for (const f of files){ try{ photos.push(await toJpeg(f,new Date(f.lastModified||Date.now()))); n++; }catch(e){ toast('Could not read '+f.name); } }
  if(n){ document.getElementById('Check25').checked=true; renderPhotos(); toast(`${n} photo${n>1?'s':''} added`); }
}

function fillFromID(info){

  const map=[['name','Text27'],['sex','Text26'],['hair','Text15'],['eyes','Text16'],['height','Text17'],['weight','Text24'],['dob','Text28'],

  if(info.dob) document.getElementById('Text28').dispatchEvent(new Event('change'));
  document.getElementById('Text27').closest('section').scrollIntoView({behavior:'smooth',block:'start'});
  toast(`Victim info filled from ID (${done.length} fields) — please verify`);
  return true;
}
function handleRaw(raw){ const info=parseAAMVA(raw); if(fillFromID(info)){ document.getElementById('dlgScan').close(); return true; } return false; }
document.getElementById('bScan').onclick=async()=>{
  const d=document.getElementById('dlgScan'), m=document.getElementById('scanMsg'), cam=document.getElementById('scanCam'), ta=document.getElementById('scanText');
  ta.value=''; m.classList.remove('err'); d.showModal();
  const det=await getDetector();
  document.getElementById('scanFromPhoto').hidden=!det;

    cam.hidden=false; m.textContent='Hold the barcode on the back of the card inside the frame.';
    const v=document.getElementById('scanVideo');
    if(!await startVideo(v,m)){ cam.hidden=true; return; }
    scanning=true;
    const loop=async()=>{ if(!scanning) return;
      try{ if(v.readyState>=2){ const r=await det.detect(v); if(r.length){ if(handleRaw(r[0].rawValue)) return; m.textContent='Barcode read, but it isn’t a driver’s license / ID barcode.'; } } }catch(e){}
      setTimeout(loop,200); };
    loop();
  } else {
    cam.hidden=true;
    m.textContent = det ? 'No camera found. Use a photo of the barcode, a handheld scanner, or paste the data below.'
      : 'Camera barcode scanning isn’t supported in this browser (it works in Chrome on Android, Mac and Chromebook). Use a handheld 2D scanner or paste the barcode data below.';
    setTimeout(()=>ta.focus(),50);
  }
};
let scanT;
document.getElementById('scanText').addEventListener('input',e=>{ clearTimeout(scanT); scanT=setTimeout(()=>{ if(/D(AQ|CS|AA)/.test(e.target.value)) handleRaw(e.target.value); },700); });
document.getElementById('scanApply').onclick=()=>{ const v=document.getElementById('scanText').value; const m=document.getElementById('scanMsg');

document.getElementById('fileBarcode').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; const m=document.getElementById('scanMsg');
  try{ const bmp=await createImageBitmap(f); const r=await (await getDetector()).detect(bmp); if(!r.length){ m.textContent='No barcode found in that photo. Try a closer, sharper shot.'; m.classList.add('err'); return; }

  catch(err){ m.textContent='Could not read that photo.'; m.classList.add('err'); } };

// ---------- Supervisor signature ----------
const sig={strokes:[],signedAt:null,dataUrl:null};
(function(){
  const pad=document.getElementById('sigPad'), cv=document.getElementById('sigCanvas'), ctx=cv.getContext('2d');
  function size(){ const r=pad.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); redraw(); }
  function drawStroke(st){ ctx.strokeStyle='#0d1b3e'; ctx.lineCap='round'; ctx.lineJoin='round';
    for(let i=1;i<st.length;i++){ const a=st[i-1], b=st[i]; ctx.lineWidth=Math.max(1.4,Math.min(3.2,2.8-(b.v||0)*0.9)); ctx.beginPath();
      if(i>1){ const p=st[i-2]; ctx.moveTo((p.x+a.x)/2,(p.y+a.y)/2); ctx.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2); } else { ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
      ctx.stroke(); }
    if(st.length===1){ ctx.fillStyle='#0d1b3e'; ctx.beginPath(); ctx.arc(st[0].x,st[0].y,1.5,0,7); ctx.fill(); } }
  function redraw(){ ctx.clearRect(0,0,cv.width,cv.height); sig.strokes.forEach(drawStroke); document.getElementById('sigPh').style.display=sig.strokes.length?'none':'flex'; }
  window.sigRedraw=redraw; window.sigResize=size;
  let cur=null, last=null;
  const pt=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,t:e.timeStamp}; };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); cur=[pt(e)]; last=cur[0]; sig.strokes.push(cur); redraw(); });
  cv.addEventListener('pointermove',e=>{ if(!cur) return; const p=pt(e); const d=Math.hypot(p.x-last.x,p.y-last.y); if(d<1) return; p.v=d/Math.max(1,p.t-last.t); cur.push(p); last=p; redraw(); });
  const end=()=>{ if(!cur) return; cur=null; sig.signedAt=new Date(); sig.dataUrl=null; updateStatus(); };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end); cv.addEventListener('pointerleave',e=>{ if(cur&&e.buttons===0) end(); });
  document.getElementById('sigClear').onclick=()=>{ sig.strokes=[]; sig.signedAt=null; sig.dataUrl=null; redraw(); updateStatus(); };
  new ResizeObserver(size).observe(pad); size();
})();
function updateStatus(){ const n=document.getElementById('Text83').value.trim(); document.getElementById('sigStatus').textContent = sig.strokes.length ? `Signed${n?' by '+n:''} · ${stamp(sig.signedAt||new Date())}` : ''; }
document.getElementById('Text83').addEventListener('input',updateStatus);
// Export trimmed, transparent PNG of the strokes
async function sigPng(){
  if(!sig.strokes.length) return null;
  const pts=sig.strokes.flat(); const pad=6, sc=3;
  const minX=Math.min(...pts.map(p=>p.x))-pad, minY=Math.min(...pts.map(p=>p.y))-pad, maxX=Math.max(...pts.map(p=>p.x))+pad, maxY=Math.max(...pts.map(p=>p.y))+pad;
  const w=Math.max(10,Math.round((maxX-minX)*sc)), h=Math.max(10,Math.round((maxY-minY)*sc));
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.scale(sc,sc); x.translate(-minX,-minY);
  x.strokeStyle='#0d1b3e'; x.lineCap='round'; x.lineJoin='round';
  sig.strokes.forEach(st=>{ for(let i=1;i<st.length;i++){ const a=st[i-1], b=st[i]; x.lineWidth=Math.max(1.4,Math.min(3.2,2.8-(b.v||0)*0.9)); x.beginPath();
      if(i>1){ const p=st[i-2]; x.moveTo((p.x+a.x)/2,(p.y+a.y)/2); x.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2); } else { x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); } x.stroke(); }
    if(st.length===1){ x.fillStyle='#0d1b3e'; x.beginPath(); x.arc(st[0].x,st[0].y,1.5,0,7); x.fill(); } });
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  return {bytes:new Uint8Array(await blob.arrayBuffer()), w, h};
}
